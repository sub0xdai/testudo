[package]
name = "testudo-cli"
version = "0.1.0"
edition = "2021"
description = "Testudo trading agent harness — ratatui TUI, LLM-powered autonomous trading"

[[bin]]
name = "testudo"
path = "src/main.rs"

[dependencies]
# ── TUI ──
ratatui = "0.29"
crossterm = "0.28"

# ── Async ──
tokio = { version = "1", features = ["full"] }
tokio-tungstenite = { version = "0.24", features = ["native-tls"] }
futures-util = "0.3"

# ── CLI ──
clap = { version = "4", features = ["derive"] }
async-trait = "0.1"

# ── HTTP ──
reqwest = { version = "0.12", features = ["json", "rustls-tls"], default-features = false }

# ── Serialization / Config ──
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
directories = "5"

# ── Types ──
common_utils = { path = "../testudo-exchange/crates/common_utils" }
uuid = { version = "1", features = ["v4"] }
chrono = { version = "0.4", features = ["serde"] }
rust_decimal = { version = "1", features = ["serde"] }
thiserror = "2"

# ── Observability ──
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
tracing-appender = "0.2"

[dev-dependencies]
serde_json = "1"
tempfile = "3"

[profile.release]
lto = true
strip = true
opt-level = 3
