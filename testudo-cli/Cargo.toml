[package]
name = "testudo-cli"
version = "0.1.0"
edition = "2021"
description = "Testudo trading agent harness — ratatui TUI, LLM-powered autonomous trading"

[[bin]]
name = "testudo"
path = "src/main.rs"

[dependencies]
# ── TUI ──
ratatui = "0.29"
crossterm = "0.28"

# ── Async ──
tokio = { version = "1", features = ["full"] }

# ── CLI ──
clap = { version = "4", features = ["derive"] }

# ── Serialization / Config ──
serde = { version = "1", features = ["derive"] }
toml = "0.8"
directories = "5"

# ── Observability ──
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[profile.release]
lto = true
strip = true
opt-level = 3
