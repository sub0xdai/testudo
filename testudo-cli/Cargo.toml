[package]
name = "testudo-cli"
version = "0.1.0"
edition = "2021"
description = "Testudo trading agent harness — ratatui TUI, LLM-powered autonomous trading"

[[bin]]
name = "tudo"
path = "src/main.rs"

[dependencies]
# ── TUI ──
ratatui = "0.29"
crossterm = "0.28"
# tears = "0.4"  # Enable when mature; hand-rolled TEA loop as fallback

# ── Async ──
tokio = { version = "1", features = ["full"] }
tokio-tungstenite = { version = "0.24", features = ["native-tls"] }
futures-util = "0.3"

# ── CLI ──
clap = { version = "4", features = ["derive"] }

# ── HTTP ──
reqwest = { version = "0.12", features = ["json", "rustls-tls"], default-features = false }

# ── Serialization ──
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# ── Config ──
toml = "0.8"
directories = "5"

# ── Cryptography ──
ring = "0.17"
sha2 = "0.10"
hex = "0.4"

# ── Observability ──
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tracing-appender = "0.2"

# ── Utilities ──
uuid = { version = "1", features = ["v4"] }
chrono = { version = "0.4", features = ["serde"] }
rust_decimal = { version = "1", features = ["serde"] }
thiserror = "2"

# ── Shared types with backend ──
common-utils = { path = "../testudo-exchange/crates/common_utils" }

[profile.release]
lto = true
strip = true
opt-level = 3
