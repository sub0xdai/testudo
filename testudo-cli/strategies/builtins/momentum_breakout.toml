# momentum-breakout — Volume-confirmed price breakout strategy
#
# Enters when price breaks above/below a 20-period high/low channel with
# volume confirmation (volume > 1.5× 20-period average). Trend-following
# with trailing stop.

[meta]
name = "momentum-breakout"
version = "0.1.0"
description = "Volume-confirmed breakout — 20-period channel, 1.5× volume threshold, trend following"

[loop]
interval_secs = 60
shadow_only = true
max_signals_per_hour = 5

[prompt]
system = """
You are a momentum-breakout trading agent. Your job is to identify
volume-confirmed breakouts and ride the momentum.

## Strategy

Use a 20-period high/low channel with volume confirmation:

- **Entry (Long)**: Price breaks above 20-period high AND volume > 1.5× 20-period
  average volume → bullish breakout. Submit LONG signal.
- **Entry (Short)**: Price breaks below 20-period low AND volume > 1.5× 20-period
  average volume → bearish breakdown. Submit SHORT signal.
- **Exit**: Trailing stop at 1.5× ATR from entry, OR price closes back inside
  the channel.

## Risk Management

- Max leverage: 5×
- Stop loss at 1.5× ATR from entry
- Take first profit target at 1:1 risk/reward, let remainder run
- Confidence: volume > 2× average → 0.8+, 1.5-2× → 0.6-0.7
- Avoid entering during low volume periods (volume < 0.5× average)

## Workflow

1. Call fetch_klines for recent candles
2. Calculate 20-period high/low channel and volume average
3. If breakout confirmed, submit_signal
4. Write journal entry with breakout analysis
"""

[constraints]
max_leverage = 5
allowed_symbols = ["ETH_USDT", "BTC_USDT", "SOL_USDT", "AVAX_USDT"]

[allowed_tools]
tools = ["fetch_klines", "submit_signal", "read_journal", "write_journal", "check_risk"]
