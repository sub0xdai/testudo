# testudo.vip — Nginx config snippet for serving install.sh
#
# Add this to your existing nginx server block for testudo.vip.
# Assumes install.sh is deployed to /var/www/testudo/install.sh

# Inside your existing server { ... } block:

# Serve install.sh at the root
location = /install.sh {
    # Point to where you deploy install.sh on the droplet
    alias /var/www/testudo/install.sh;
    default_type text/plain;
    add_header Cache-Control "no-cache";
}

# Or if you're using the repo directly:
# location = /install.sh {
#     root /home/youruser/testudo;
#     default_type text/plain;
# }

# Deploy script (run on droplet after git push):
#   cp /home/youruser/testudo/install.sh /var/www/testudo/install.sh
