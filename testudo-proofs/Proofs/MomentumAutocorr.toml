# MomentumAutocorr.toml — strategy artifact for testudo-proofs
#
# Maps to Proofs/MomentumAutocorr.lean.
# Consumed by AGENT-09-strategy-system.

[meta]
name = "momentum"
version = "1.0.0"
description = "Momentum autocorrelation — covariance direction → expected return direction"
lean_file = "Proofs/MomentumAutocorr.lean"

[theorem]
name = "momentum_pos_cov + momentum_neg_cov"
statement = "For a 2-point equally-weighted distribution, positive covariance (cov₂ > 0) implies that conditioning on x above its mean increases the expectation of y above its unconditional mean. Negative covariance implies the opposite."
formula = "cov₂(x₁,x₂,y₁,y₂) = (x₁-x₂)(y₁-y₂)/4"
implications = [
    "Positive lag-1 autocorrelation (ρ₁ > 0) → momentum regime: positive returns predict further positive returns",
    "Negative lag-1 autocorrelation (ρ₁ < 0) → mean-reversion regime: positive returns predict negative returns",
    "Zero autocorrelation → no directional edge — halt trading",
]
lean_line = 50

[constraints]
# Derivation: statistical significance of ρ₁ at n=50 samples:
# t = ρ·√(n-2)/√(1-ρ²) → critical ρ at 95% confidence ≈ 0.09 → round up to 0.10.

# Minimum absolute autocorrelation for a statistically significant signal.
min_autocorr_threshold = 0.10

# Number of samples required for reliable autocorrelation estimation.
min_samples_for_autocorr = 50

# Maximum lookback for computing autocorrelation.
max_lag = 5

[prompt]
system_prompt = """
## Entry Logic — Momentum / Mean Reversion Selection

The sign of lag-1 autocorrelation (ρ₁) determines which strategy to apply:

    ρ₁ > 0.10  →  MOMENTUM: positive returns predict further positive returns
    ρ₁ < -0.10 →  MEAN REVERSION: positive returns predict negative returns
    |ρ₁| ≤ 0.10 →  NO EDGE: skip the trade

This relationship is PROVEN for the 2-point covariance model.
See testudo-proofs/Proofs/MomentumAutocorr.lean.

### Momentum Entry (ρ₁ > 0.10)
- Enter LONG when price breaks above 20-period resistance with volume > 1.5× average.
- Enter SHORT when price breaks below 20-period support with volume > 1.5× average.
- Use trailing stop: activate after 1.5 ATR profit, trail at 40% of the move.
- No fixed take-profit — let the trend run.

### Mean Reversion Entry (ρ₁ < -0.10)
- Follow the OU mean reversion rules in OUMreversion.toml.
- Enter at 2σ deviation, target the 20-period SMA.

### Halt (|ρ₁| ≤ 0.10)
- Do NOT trade. No directional edge exists.
- Wait for the next 4h candle close and recompute.

### How to Compute ρ₁
1. Call `fetch_klines` with interval=4h, limit=100.
2. Compute log returns: r[t] = ln(close[t]/close[t-1]).
3. Compute ρ₁ = corr(r[1:], r[:-1]) using at least 50 samples.
4. If |ρ₁| < 0.10, the signal is not statistically significant — halt.
"""
