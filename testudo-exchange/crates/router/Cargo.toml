[package]
name = "router"
version = "0.1.0"
edition = "2021"

[dependencies]
actix-cors.workspace = true
actix-files.workspace = true
actix-multipart.workspace = true
actix-web.workspace = true
confik.workspace = true
dotenvy.workspace = true
serde.workspace = true
serde_json.workspace = true
rust_decimal.workspace = true
rust_decimal_macros.workspace = true
uuid.workspace = true
jsonwebtoken = "9.3"
futures-util = "0.3"
validator = { version = "0.20", features = ["derive"] }
sqlx.workspace = true
log = "0.4"
tracing.workspace = true
tracing-subscriber.workspace = true
tracing-actix-web.workspace = true
prometheus = "0.14"
lazy_static = "1.4"
regex = "1"

# Credential encryption
aes-gcm = "0.10"
hex = "0.4"
hmac = "0.12"
sha2 = "0.10"
reqwest = { version = "0.12", features = ["json"] }

# HIST-02: CEX history fetcher auth (Base64 signing for OKX/Bitget/BloFin)
base64 = "0.22"

# Exchange router dependencies
async-trait.workspace = true
chrono.workspace = true
tokio.workspace = true
tokio-tungstenite.workspace = true
tokio-util = "0.7"
thiserror = "1.0"
rand.workspace = true
dashmap = "5.5"

# HL-01/02: Hyperliquid native integration
hyperliquid-sdk-rs = "0.1.2"
alloy = { version = "0.1", features = ["signers", "signer-local"] }

# AUTH-03: Solana wallet authentication
ed25519-dalek = "2"
bs58 = "0.5"

# RSK-03: AI trade coach — OpenAI-compatible LLM client (DeepSeek/GLM/OpenRouter)
async-openai = { version = "0.38", default-features = false, features = ["rustls", "chat-completion"] }

common_utils = { path = "../common_utils" }
engine = { version = "0.1.0", path = "../engine" }
sqlx_postgres = { path = "../sqlx_postgres" }
db-processor = { path = "../db-processor" }
pg_queue = { path = "../pg_queue" }

[dev-dependencies]
tokio-test = "0.4"
mockito = "1"
