# cargo audit exception policy
# Generated by CLN-01-dependency-hardening CP-2 (2026-05-17)
# Revised by HL-12 CP-5 (2026-09-20).
#
# Method, because "this entry exists because of dependency X" is a claim about the
# present graph and not about the history of this file:
#
#   1. Empty the ignore list and re-run `cargo audit` to see what actually matches.
#   2. `cargo update -p <crate> --dry-run` to see whether a fix is reachable.
#   3. `cargo tree -p router --target all -e normal` to see whether it is built at
#      all. `cargo audit` scans Cargo.lock, which records optional dependencies
#      whether or not their features are enabled, so the two disagree.
#
# Six entries were pruned or fixed rather than carried:
#   RUSTSEC-2025-0073  alloy-dyn-abi      no longer matches, entry removed
#   RUSTSEC-2024-0370  proc-macro-error   left the lock, entry removed
#   RUSTSEC-2026-0002  lru                no longer matches, entry removed
#   RUSTSEC-2024-0388  derivative         still matched, kept below
#   RUSTSEC-2024-0436  paste              still matched, kept below
#   RUSTSEC-2026-0235  rkyv 0.7.46        fixed by moving rust_decimal to 1.43.0,
#                                         which dropped its optional rkyv ^0.7
#
# Everything else that was failing on 2026-09-20 was upgraded: anyhow, rustls,
# event-listener, ruint, quinn-proto, h2 0.4, actix-http, validator_derive.
# Six vulnerabilities became one.

[advisories]
ignore = [
    # rsa 0.9.10: Marvin Attack (CVSS 5.9, MEDIUM), RUSTSEC-2023-0071
    # Transitive through sqlx-mysql. No fix is available upstream: sqlx has no
    # release that drops it, and the rsa dependency is unused at runtime for our
    # Postgres-only configuration.
    "RUSTSEC-2023-0071",

    # derivative 2.2.0: unmaintained, RUSTSEC-2024-0388
    # Still present in the lock after the alloy 2 swap. Unmaintained, not a
    # vulnerability; no drop-in replacement is reachable from here.
    "RUSTSEC-2024-0388",

    # paste 1.0.15: unmaintained, RUSTSEC-2024-0436
    # Still present in the lock after the alloy 2 swap. Unmaintained, not a
    # vulnerability; the maintained successor is pastey and no dependency in the
    # graph has moved to it yet.
    "RUSTSEC-2024-0436",

    # h2 0.3.27: unbounded empty DATA frames, RUSTSEC-2026-0258
    # The required fix is h2 >= 0.4.16, and h2 0.3 cannot satisfy it: 0.3 and 0.4
    # are separate majors. The dependency arrives through actix-http 3.13.6,
    # which is the newest 3.x release (published 2026-09-15) and declares
    # `h2 = "^0.3.27"` as an optional dependency that actix-web enables. Moving
    # to h2 0.4 needs actix-http 4 and therefore actix-web 5.
    #
    # Verified 2026-09-20 against crates.io: no actix-http 3.x accepts h2 0.4,
    # and `cargo update -p actix-http` selects 3.13.6 as the newest compatible
    # release. `cargo tree -p router --target all -e normal` confirms h2 0.3.27
    # IS in the build graph, so this is not one of the lock-only entries.
    #
    # Exposure: h2 is reached through actix-http, so this is exploitable only by a
    # peer that can open HTTP/2 to the router. No mitigation is applied in-tree,
    # and whether HTTP/2 is reachable in the deployment has not been established.
    # This entry records an accepted risk with a known end date: actix-web 5.
    "RUSTSEC-2026-0258",
]

[yanked]
# Left at the default (warn). Two yanked crates remain in the lock:
# chacha20 0.10.0 via rand 0.10.1, and spin 0.9.8 via lazy_static. Both predate
# this work and neither has a reachable replacement in the current graph.
