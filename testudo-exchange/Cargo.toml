[workspace]
resolver = "2"
members = ["crates/*"]

[workspace.dependencies]
actix-cors = "0.6"
actix-files = "0.6"
actix-multipart = "0.7"
actix-web = "4"
async-trait = "0.1.83"
chrono = { version = "0.4.38", features = ["serde"] }
confik = "0.11"
dotenvy = "0.15"
env_logger = "0.10.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["json", "env-filter"] }
tracing-actix-web = "0.7"
futures-util = "0.3.30"
rand = "0.8.5"
rust_decimal = "1.36.0"
rust_decimal_macros = "1.36.0"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1.0.117", features = ["raw_value"] }
sqlx = { version = "0.8.2", features = ["postgres", "runtime-tokio", "bigdecimal", "rust_decimal", "time", "uuid", "chrono"] }
tokio = { version = "1.10.0", features = ["full"] }
tokio-tungstenite = { version = "0.24.0", features = ["native-tls"] }
uuid = { version = "1.10.0", features = ["v4", "v5", "serde"] }
# TS-01 follow-up: `hyperliquid-sdk-rs` 0.1.2 builds the `spotUser`/
# `classTransfer` action with the wrong wire field name, so spot -> perp
# transfers are rejected by the exchange. The fix is one attribute on one
# field, which is not something a caller can work around.
#
# Patched here rather than by editing the cargo registry during deploy. A
# deploy-time sed kept production on a different dependency tree than every
# other environment, so a green local test run said nothing about the droplet
# build, and an incomplete sed broke the build outright. A path patch keeps one
# source of truth and puts the change under review.
[patch.crates-io]
hyperliquid-sdk-rs = { path = "vendor/hyperliquid-sdk-rs" }
