name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.target }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target:
          - x86_64-unknown-linux-gnu
          - aarch64-unknown-linux-gnu

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Build release binary
        working-directory: testudo-cli
        run: cargo build --release --target ${{ matrix.target }}

      - name: Package tarball
        working-directory: testudo-cli
        run: |
          cd target/${{ matrix.target }}/release
          tar -czf testudo-${{ matrix.target }}.tar.gz testudo
          shasum -a 256 testudo-${{ matrix.target }}.tar.gz > testudo-${{ matrix.target }}.tar.gz.sha256

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: testudo-${{ matrix.target }}
          path: |
            testudo-cli/target/${{ matrix.target }}/release/testudo-${{ matrix.target }}.tar.gz
            testudo-cli/target/${{ matrix.target }}/release/testudo-${{ matrix.target }}.tar.gz.sha256

  publish:
    name: Publish GitHub Release
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ github.ref_name }}
          body: |
            ## Install

            ```bash
            curl -fsSL https://api.testudo.vip/install.sh | bash
            ```

            ## Checksums

            See `.sha256` files below.
          files: artifacts/**/*
          draft: false
          prerelease: false
