name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-latest
          - target: x86_64-apple-darwin
            os: macos-latest
          - target: aarch64-apple-darwin
            os: macos-latest
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            ext: .exe

    steps:
      - uses: actions/checkout@v4

      - name: Install system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libssl-dev pkg-config

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Build release binary
        working-directory: testudo-cli
        run: cargo build --release --target ${{ matrix.target }}

      - name: Package (unix)
        if: runner.os != 'Windows'
        working-directory: testudo-cli
        run: |
          cd target/${{ matrix.target }}/release
          tar -czf testudo-${{ matrix.target }}.tar.gz testudo
          shasum -a 256 testudo-${{ matrix.target }}.tar.gz > testudo-${{ matrix.target }}.tar.gz.sha256

      - name: Package (windows)
        if: runner.os == 'Windows'
        working-directory: testudo-cli
        shell: pwsh
        run: |
          cd target/${{ matrix.target }}/release
          Compress-Archive -Path testudo.exe -DestinationPath testudo-${{ matrix.target }}.zip
          Get-FileHash testudo-${{ matrix.target }}.zip -Algorithm SHA256 | ForEach-Object { "$($_.Hash)  testudo-${{ matrix.target }}.zip" } > testudo-${{ matrix.target }}.zip.sha256

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: testudo-${{ matrix.target }}
          path: |
            testudo-cli/target/${{ matrix.target }}/release/testudo-${{ matrix.target }}.*

  publish:
    name: Publish GitHub Release
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ github.ref_name }}
          body: |
            ## Install

            **Linux & macOS:**
            ```bash
            curl -fsSL https://api.testudo.vip/install.sh | bash
            ```

            **Windows:**
            Download the `.zip` below and extract.
          files: artifacts/**/*
          draft: false
          prerelease: false
